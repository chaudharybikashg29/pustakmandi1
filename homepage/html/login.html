<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | PustakMandi</title>

    <link rel="stylesheet"
          href="../css/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body class="home-page">
<div>ths</div>
<div class="container">


    <!-- LEFT SIDE -->

    <div class="left">

        <div class="overlay">

            <h1>Welcome Back!</h1>

            <p>
                Buy and Sell Books, Notes,
                Electronics and more inside your campus.
            </p>

        </div>

    </div>

    <!-- RIGHT SIDE -->

    <div class="right">

        <div>

            <!-- LOGO -->

            <div class="p-logo-container">

                <img
                    class="p-logo"
                    src="../images/pustakmandi.jpg"
                    alt="PustakMandi Logo">

            </div>


            <!-- LOGIN FORM -->

            <form
                class="login-form"
                action="../../login.php"
                method="POST">


                <h2>Login</h2>


                <!-- EMAIL / USERNAME -->

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="Email or Username"
                        autocomplete="username"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>

                    <span id="togglePassword">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>


                <!-- OPTIONS -->

                <div class="options">

                    <label>

                        <input
                            type="checkbox"
                            name="remember">

                        Remember Me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                    name="login_button">

                    Login

                </button>


                <!-- DIVIDER -->

                <div class="divider">

                    OR

                </div>


                <!-- SOCIAL LOGIN -->

                <div class="social-login">

                    <button
                        type="button"
                        class="google">

                        <i class="fab fa-google"></i>

                        Google

                    </button>


                    <button
                        type="button"
                        class="facebook">

                        <i class="fab fa-facebook-f"></i>

                        Facebook

                    </button>

                </div>


                <!-- SIGNUP -->

                <p class="signup">

                    Don't have an account?

                    <a href="signup.html">
                        Sign Up
                    </a>

                </p>

            </form>

        </div>

    </div>

</div>


<script src="../js/login.js"></script>

</body>

</html>
